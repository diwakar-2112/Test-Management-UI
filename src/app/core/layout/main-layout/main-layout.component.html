<!-- Layout Wrapper -->
<div class="h-screen flex bg-background text-text-main overflow-hidden transition-colors ">

    <!-- Sidebar (Desktop) - Fixed Width & Glass Effect in Dark Mode -->
    <aside
        class="hidden md:flex w-72 flex-col bg-surface/95 backdrop-blur-sm border-r border-border z-20 transition-colors ">

        <!-- Logo Area -->
        <div class="h-20 flex items-center gap-4 px-8 border-b border-border/50">
            <div
                class="h-10 w-10 rounded-xl bg-gradient-to-br from-primary to-orange-600 shadow-lg shadow-primary/40 flex items-center justify-center text-sm font-extrabold text-white tracking-wide transform hover:scale-110 transition-transform  cursor-pointer">
                QA
            </div>
            <div class="flex flex-col">
                <p class="text-base font-bold text-text-main leading-tight tracking-tight">QA Console</p>
                <p class="text-[10px] uppercase font-bold text-text-secondary tracking-widest mt-0.5">Admin Workspace
                </p>
            </div>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 py-8 px-4 space-y-2 overflow-y-auto">
            <p class="px-4 mb-4 text-[11px] font-bold tracking-widest uppercase text-text-secondary/80">
                Menu
            </p>

            <!-- Active Item Handling with RouterLinkActive -->
            <a routerLink="/projects"
                routerLinkActive="bg-primary/10 text-primary shadow-[0_0_20px_rgba(var(--primary)_/_0.15)] border-primary/20"
                [routerLinkActiveOptions]="{ exact: false }"
                class="relative w-full flex items-center gap-3 px-4 py-3 text-sm font-semibold text-text-secondary rounded-2xl border border-transparent   hover:text-text-main group overflow-hidden">

                <!-- Shine Effect (Only visible when active - controlled manually or via CSS if needed, 
             but simpler to just have it on the element structure) -->
                <!-- Note: Simulating the 'active' glow/shine complex logic might need conditional classes. 
             For now, relying on routerLinkActive styles above. -->

                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M3 7h7v10H3zM14 7h7v6h-7zM14 15h7v2a2 2 0 0 1-2 2h-5z" />
                </svg>
                Projects
            </a>

            <!-- Test Runs -->
            <a routerLink="/test-runs"
                routerLinkActive="bg-primary/10 text-primary shadow-[0_0_20px_rgba(var(--primary)_/_0.15)] border-primary/20"
                [routerLinkActiveOptions]="{ exact: false }"
                class="group relative w-full flex items-center gap-3 px-4 py-3 text-sm font-medium text-text-secondary rounded-2xl border border-transparent hover:bg-surface-highlight hover:text-text-main   overflow-hidden">
                <svg class="w-5 h-5"
                    fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h7" />
                </svg>
                Test runs
            </a>

            <!-- <button
                class="group w-full flex items-center gap-3 px-4 py-3 text-sm font-medium text-text-secondary rounded-2xl hover:bg-surface-highlight hover:text-text-main  ">
                <svg class="w-5 h-5 text-text-secondary group-hover:text-primary transition-colors "
                    fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                </svg>
                Defects
            </button> -->

            <button
                class="group w-full flex items-center gap-3 px-4 py-3 text-sm font-medium text-text-secondary rounded-2xl hover:bg-surface-highlight hover:text-text-main  ">
                <svg class="w-5 h-5 text-text-secondary group-hover:text-primary transition-colors "
                    fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm7 8a7 7 0 0 0-14 0" />
                </svg>
                Users & roles
            </button>
        </nav>

        <!-- Sidebar Footer -->
        <div class="p-4 mt-auto">
            <div class="rounded-2xl bg-surface-highlight/50 border border-border p-4 shadow-sm backdrop-blur-md">
                <div class="flex items-center gap-3">
                    <div
                        class="h-9 w-9 rounded-full bg-gradient-to-tr from-gray-200 to-gray-300 dark:from-gray-700 dark:to-gray-600 flex items-center justify-center border border-white/20">
                        <span class="font-bold text-xs text-text-main">QA</span>
                    </div>
                    <div class="flex flex-col">
                        <p class="text-[10px] text-text-secondary font-medium">Currently in</p>
                        <div class="flex items-center gap-1.5">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                            <p class="text-xs font-bold text-text-main">QA Environment</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col relative overflow-hidden">

        <!-- Ambient Background Glow (Dynamic based on theme) -->
        <div
            class="absolute top-[-10%] left-[-10%] w-[400px] h-[400px] bg-primary/20 rounded-full blur-3xl pointer-events-none opacity-50 mix-blend-screen dark:mix-blend-lighten">
        </div>
        <div
            class="absolute bottom-[-10%] right-[-10%] w-[300px] h-[300px] bg-purple-500/10 rounded-full blur-3xl pointer-events-none opacity-40">
        </div>

        <!-- Top Header (Floating & Glassy) -->
        <header
            class="h-20 flex items-center justify-between px-6 lg:px-10 z-30 sticky top-0 bg-background/70 backdrop-blur-xl border-b border-white/5 ">

            <!-- Left: Breadcrumb -->
            <div class="flex items-center gap-4 animate-entry">
                <!-- Mobile Menu Toggle (Hidden on Desktop) -->
                <button (click)="toggleMobileMenu()" class="md:hidden p-2 -ml-2 text-text-secondary">
                    <mat-icon>menu</mat-icon>
                </button>

                <div class="flex flex-col">
                    <h1 class="text-xl font-bold text-text-main tracking-tight flex items-center gap-2">
                        Projects
                        <span
                            class="px-2 py-0.5 rounded-md bg-surface border border-border text-[10px] text-text-secondary font-mono">{{projectCount()}}
                            Total</span>
                    </h1>
                    <p class="text-xs text-text-secondary font-medium">Manage your testing suites</p>
                </div>
            </div>

            <!-- Right: Actions -->
            <div class="flex items-center gap-3 sm:gap-5 animate-entry">

                <!-- Theme Toggle (Animated) -->
                <button (click)="toggleTheme()"
                    class="relative p-2.5 rounded-full bg-surface border border-border text-text-secondary hover:text-primary hover:border-primary/30   hover:shadow-lg hover:shadow-primary/20 active:scale-90 group overflow-hidden">
                    <div class="relative z-10 transition-transform  rotate-0 dark:rotate-180">
                        @if (themeService.themeSignal() === 'dark') {
                        <mat-icon class="text-[22px] animate-in fade-in zoom-in ">light_mode</mat-icon>
                        } @else {
                        <mat-icon class="text-[22px] animate-in fade-in zoom-in ">dark_mode</mat-icon>
                        }
                    </div>
                </button>

                <!-- Notification Bell -->
                <button
                    class="relative p-2.5 rounded-full bg-surface text-text-secondary hover:text-primary border border-border hover:border-primary/30  hover:shadow-md active:scale-95">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path
                            d="M14.857 17.657A2 2 0 0 1 13 19H11a2 2 0 0 1-1.857-1.343M15 8a3 3 0 1 0-6 0c0 3-1 4-2 5h10c-1-1-2-2-2-5Z" />
                    </svg>
                    <span
                        class="absolute top-2 right-2.5 h-2 w-2 rounded-full bg-red-500 ring-2 ring-surface animate-pulse"></span>
                </button>

                <!-- User Profile (Pill Shape) -->
                <button
                    class="flex items-center gap-3 pl-1 pr-4 py-1.5 rounded-full bg-surface border border-border shadow-sm hover:shadow-md hover:border-primary/20  active:scale-95 group">
                    <div
                        class="h-9 w-9 rounded-full bg-gradient-to-tr from-primary to-purple-600 text-white text-xs font-bold flex items-center justify-center shadow-lg group-hover:scale-105 transition-transform">
                        {{ initials() }}
                    </div>
                    <div class="hidden sm:flex flex-col items-start">
                        <span class="text-xs font-bold text-text-main leading-none">{{userName()||''}}</span>
                        <!-- <span class="text-[10px] text-text-secondary leading-none mt-1">Admin</span> -->
                    </div>
                </button>
            </div>
        </header>

        <!-- Scrollable Content -->
        <main class="flex-1 overflow-y-auto px-6 lg:px-10 py-8 scroll-smooth">
            <router-outlet></router-outlet>
        </main>
    </div>
</div>
