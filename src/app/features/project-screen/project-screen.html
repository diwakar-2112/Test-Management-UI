<div class="p-8 animate-fade-in">
  @if (project(); as proj) {
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-text-main mb-2 tracking-tight">{{ proj.name }}</h1>
    <p class="text-text-secondary text-lg">{{ proj.description }}</p>
  </div>

  <!-- Stats Grid -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
    <!-- Test Suites -->
    <div
      class="bg-surface border border-border rounded-2xl p-6 shadow-sm hover:shadow-md transition-all duration-300 hover:-translate-y-1 group">
      <div class="flex items-center justify-between mb-4">
        <p class="text-text-secondary font-medium">Test Suites</p>
        <div class="w-10 h-10 rounded-full bg-blue-500/10 flex items-center justify-center">
          <i class="pi pi-folder text-blue-500 text-xl group-hover:scale-110 transition-transform"></i>
        </div>
      </div>
      <p class="text-4xl font-bold text-text-main">{{ proj.testSuiteCount }}</p>
    </div>

    <!-- Test Cases -->
    <div
      class="bg-surface border border-border rounded-2xl p-6 shadow-sm hover:shadow-md transition-all duration-300 hover:-translate-y-1 group">
      <div class="flex items-center justify-between mb-4">
        <p class="text-text-secondary font-medium">Test Cases</p>
        <div class="w-10 h-10 rounded-full bg-purple-500/10 flex items-center justify-center">
          <i class="pi pi-file text-purple-500 text-xl group-hover:scale-110 transition-transform"></i>
        </div>
      </div>
      <p class="text-4xl font-bold text-text-main">{{ proj.testCaseCount }}</p>
    </div>

    <!-- Test Runs -->
    <div
      class="bg-surface border border-border rounded-2xl p-6 shadow-sm hover:shadow-md transition-all duration-300 hover:-translate-y-1 group">
      <div class="flex items-center justify-between mb-4">
        <p class="text-text-secondary font-medium">Test Runs</p>
        <div class="w-10 h-10 rounded-full bg-orange-500/10 flex items-center justify-center">
          <i class="pi pi-play text-orange-500 text-xl group-hover:scale-110 transition-transform"></i>
        </div>
      </div>
      <p class="text-4xl font-bold text-text-main">{{ proj.testRunCount }}</p>
    </div>
  </div>
  } @else {
  <!-- Loading/Empty State -->
  <div class="mb-8 space-y-4">
    <div class="h-8 w-1/3 bg-surface-100 dark:bg-surface-800 rounded animate-pulse"></div>
    <div class="h-4 w-1/2 bg-surface-100 dark:bg-surface-800 rounded animate-pulse"></div>
  </div>
  }

  <!-- Chart Section -->
  <div class="p-6 bg-surface border border-border rounded-2xl shadow-sm">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h2 class="text-xl font-semibold text-text-main">Project Activity</h2>
        <p class="text-text-secondary text-sm mt-1">Number of project updates in the past week</p>
      </div>
      <button
        class="p-2 hover:bg-surface-100 dark:hover:bg-surface-800 rounded-lg text-text-secondary transition-colors">
        <i class="pi pi-ellipsis-h"></i>
      </button>
    </div>
    <div class="card">
      <p-chart type="line" [data]="data" [options]="options" class="h-[20rem]" />
    </div>
  </div>
</div>
