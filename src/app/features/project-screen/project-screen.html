<div class="p-8">
  <h1 class="text-2xl font-bold text-text-main">Project Details</h1>
  <p class="text-text-secondary mt-2">You are viewing details for project: <span class="text-primary font-mono">{{
      projectId() }}</span></p>

  <div class="mt-8 p-6 bg-surface border border-border rounded-2xl">
    <p class="text-text-main">Number of project updates in the past week.</p>
    <div class="card">
      <p-chart type="line" [data]="data" [options]="options" class="h-[20rem]" />
    </div>
  </div>
</div>
