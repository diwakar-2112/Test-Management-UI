<div class="animate-fade-in">

    <!-- Breadcrumb -->
    <nav class="flex items-center gap-2 text-sm mb-8">
        <a routerLink="/projects"
            class="text-text-secondary hover:text-primary font-medium transition-colors duration-200 flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M3 7h7v10H3zM14 7h7v6h-7zM14 15h7v2a2 2 0 0 1-2 2h-5z" />
            </svg>
            Projects
        </a>
        <svg class="w-3.5 h-3.5 text-text-secondary/50" fill="none" stroke="currentColor" stroke-width="2"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
        </svg>
        <a (click)="navigateBack()"
            class="text-text-secondary hover:text-primary font-medium transition-colors duration-200 cursor-pointer">
            Project
        </a>
        <svg class="w-3.5 h-3.5 text-text-secondary/50" fill="none" stroke="currentColor" stroke-width="2"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
        </svg>
        <span class="text-text-main font-bold">Test Suites</span>
    </nav>

    <!-- Header -->
    <section
        class="relative bg-surface/90 border border-border rounded-3xl p-8 shadow-xl shadow-black/5 overflow-hidden mb-8">

        <!-- Decoration -->
        <div
            class="absolute top-0 right-0 w-64 h-64 bg-blue-500/5 rounded-full blur-3xl -mr-32 -mt-32 pointer-events-none">
        </div>

        <div class="relative flex flex-col md:flex-row md:items-center md:justify-between gap-5">
            <div class="flex items-center gap-4">
                <div
                    class="h-14 w-14 rounded-2xl bg-gradient-to-br from-blue-500/15 to-surface border border-blue-500/10 flex items-center justify-center flex-shrink-0">
                    <svg class="w-7 h-7 text-blue-500" fill="none" stroke="currentColor" stroke-width="2"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-8.69-6.44l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-text-main tracking-tight">Test Suites</h1>
                    <p class="text-text-secondary text-sm mt-0.5">Organize and manage your test suites</p>
                </div>
            </div>

            <button
                class="inline-flex items-center gap-2 rounded-xl bg-blue-500 px-5 py-2.5 text-sm font-bold text-white shadow-lg shadow-blue-500/30 transition-all hover:bg-blue-600 hover:shadow-blue-500/40 hover:-translate-y-0.5 active:scale-95">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path d="M12 4v16m8-8H4" />
                </svg>
                New Test Suite
            </button>
        </div>
    </section>

    <!-- Empty State -->
    <section class="bg-surface/90 border border-border rounded-3xl shadow-xl shadow-black/5 overflow-hidden">
        <div class="flex flex-col items-center justify-center py-20 text-center">
            <div
                class="w-24 h-24 bg-background rounded-full flex items-center justify-center mb-6 shadow-xl shadow-black/5 border border-border">
                <svg class="w-10 h-10 text-text-secondary/40" fill="none" stroke="currentColor" stroke-width="1.5"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-8.69-6.44l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z" />
                </svg>
            </div>
            <h3 class="text-xl font-bold text-text-main mb-2">No Test Suites Yet</h3>
            <p class="text-text-secondary max-w-sm mb-8">
                Create your first test suite to begin organizing your test cases into logical groups.
            </p>
            <button
                class="inline-flex items-center gap-2 rounded-xl bg-blue-500 px-6 py-3 text-sm font-bold text-white shadow-lg shadow-blue-500/30 transition-all hover:bg-blue-600 hover:shadow-blue-500/40 hover:-translate-y-1 active:scale-95">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path d="M12 4v16m8-8H4" />
                </svg>
                Create First Test Suite
            </button>
        </div>
    </section>
</div>
