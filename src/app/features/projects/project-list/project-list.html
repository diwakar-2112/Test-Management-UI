<!-- Filter Bar -->
<section class="bg-surface/90 border border-border rounded-3xl p-6 shadow-xl shadow-black/5 space-y-6 animate-entry delay-200">
  <div class="flex flex-col gap-5 md:flex-row md:items-end md:justify-between">
    
    <!-- Search (Large & Modern) -->
    <div class="flex-1 w-full max-w-lg">
      <label class="block text-[11px] font-bold text-text-secondary mb-2 uppercase tracking-widest pl-1">Search Database</label>
      <div class="relative group">
        <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
          <svg class="w-5 h-5 text-text-secondary group-focus-within:text-primary transition-colors duration-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m21 21-4.35-4.35M10.5 18a7.5 7.5 0 1 0 0-15 7.5 7.5 0 0 0 0 15Z"/></svg>
        </div>
        <input type="text" placeholder="Type project name, key, or owner..." 
          class="w-full pl-12 pr-4 py-3.5 bg-background border border-border rounded-2xl text-sm font-medium text-text-main focus:outline-none focus:ring-4 focus:ring-primary/10 focus:border-primary transition-all placeholder:text-text-secondary/50 shadow-inner"
        />
      </div>
    </div>

    <!-- Dropdowns (Glassy) -->
    <div class="flex flex-wrap gap-4">
      <div class="w-40">
        <label class="block text-[11px] font-bold text-text-secondary mb-2 uppercase tracking-widest pl-1">Sort by</label>
        <div class="relative">
          <select class="w-full appearance-none rounded-xl border border-border bg-background text-sm font-medium text-text-main px-4 py-3 pr-10 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary cursor-pointer transition-all hover:border-text-secondary/30">
            <option>Date created</option>
            <option>Last run</option>
          </select>
          <span class="pointer-events-none absolute inset-y-0 right-3.5 flex items-center">
             <svg class="w-4 h-4 text-text-secondary" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- Pills -->
  <div class="flex flex-wrap gap-3 text-xs pt-1">
     <button class="flex items-center gap-2 px-4 py-2 rounded-full bg-primary/10 text-primary border border-primary/20 font-bold hover:bg-primary/20 transition-all hover:scale-105 active:scale-95">
       <span class="w-2 h-2 rounded-full bg-primary shadow-[0_0_10px_var(--primary)]"></span> Active Projects
     </button>
     <button class="flex items-center gap-2 px-4 py-2 rounded-full bg-surface text-text-secondary border border-border font-medium hover:border-text-secondary/50 hover:text-text-main transition-all hover:-translate-y-0.5">
       <span class="w-2 h-2 rounded-full bg-red-400"></span> Failing runs
     </button>
  </div>
</section>

<!-- Modern Data Table -->
<section class="mt-8 animate-entry delay-300">
  
  <div class="flex items-center justify-between mb-6 px-1">
    <h3 class="text-lg font-bold text-text-main">All Projects</h3>
    <button class="inline-flex items-center gap-2 rounded-xl bg-primary px-5 py-2.5 text-sm font-bold text-white shadow-lg shadow-primary/30 transition-all hover:bg-orange-600 hover:shadow-orange-500/40 hover:-translate-y-1 active:scale-95">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg>
      New Project
    </button>
  </div>

  <div class="bg-surface/90 border border-border rounded-3xl shadow-xl shadow-black/5 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="min-w-full text-sm">
        <thead>
          <tr class="bg-background/50 border-b border-border text-xs font-bold text-text-secondary uppercase tracking-wider text-left">
            <th class="px-6 py-5 pl-8">Project</th>
            <th class="px-6 py-5">Environment</th>
            <th class="px-6 py-5 text-right">Health</th>
            <th class="px-6 py-5 text-right">Issues</th>
            <th class="px-6 py-5">Last Activity</th>
            <th class="px-6 py-5">Status</th>
            <th class="px-6 py-5 text-right pr-8">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-border/50">
          
          <!-- Row 1 (Hover Effects) -->
          <tr class="group transition-all duration-300 hover:bg-surface-highlight hover:shadow-[inset_4px_0_0_var(--primary)]">
            <td class="px-6 py-5 pl-8">
              <div class="flex items-center gap-4">
                <div class="h-10 w-10 rounded-2xl bg-gradient-to-br from-primary/20 to-primary/5 border border-primary/20 flex items-center justify-center text-primary font-bold text-sm shadow-sm group-hover:scale-110 transition-transform duration-300">
                  TS
                </div>
                <div class="flex flex-col">
                  <span class="font-bold text-text-main text-base group-hover:text-primary transition-colors">TSTT &lt;&gt; NFT</span>
                  <code class="text-[10px] text-text-secondary bg-background px-1.5 py-0.5 rounded border border-border w-fit mt-1">TSTT-NFT</code>
                </div>
              </div>
            </td>
            <td class="px-6 py-5">
              <span class="inline-flex items-center px-3 py-1 rounded-lg bg-surface border border-border text-xs font-bold text-text-secondary shadow-sm group-hover:border-primary/30 transition-colors">
                QA Environment
              </span>
            </td>
            <td class="px-6 py-5 text-right">
               <div class="flex flex-col items-end gap-1">
                  <span class="font-bold text-emerald-500">95%</span>
                  <div class="w-20 h-1.5 bg-background rounded-full overflow-hidden">
                      <div class="h-full bg-emerald-500 w-[95%] shadow-[0_0_8px_rgba(16,185,129,0.5)]"></div>
                  </div>
               </div>
            </td>
            <td class="px-6 py-5 text-right">
              <span class="inline-block px-3 py-1 rounded-full bg-amber-500/10 text-amber-600 dark:text-amber-500 border border-amber-500/20 font-bold text-xs group-hover:bg-amber-500/20 transition-colors">
                9 Open
              </span>
            </td>
            <td class="px-6 py-5 text-xs text-text-secondary">
              <div class="flex flex-col">
                <span class="font-bold text-text-main">Today</span>
                <span>10:24 AM</span>
              </div>
            </td>
            <td class="px-6 py-5">
              <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20 text-xs font-bold">
                <span class="relative flex h-2 w-2">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                Stable
              </span>
            </td>
            <td class="px-6 py-5 text-right pr-8">
               <button class="opacity-0 group-hover:opacity-100 translate-x-4 group-hover:translate-x-0 transition-all duration-300 rounded-xl p-2.5 hover:bg-background hover:shadow-lg text-primary border border-transparent hover:border-primary/10">
                 <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
               </button>
            </td>
          </tr>

          <!-- Row 2 -->
          <tr class="group transition-all duration-300 hover:bg-surface-highlight hover:shadow-[inset_4px_0_0_var(--primary)]">
            <td class="px-6 py-5 pl-8">
              <div class="flex items-center gap-4">
                <div class="h-10 w-10 rounded-2xl bg-gradient-to-br from-purple-500/20 to-purple-500/5 border border-purple-500/20 flex items-center justify-center text-purple-500 font-bold text-sm shadow-sm group-hover:scale-110 transition-transform duration-300">
                  SL
                </div>
                <div class="flex flex-col">
                  <span class="font-bold text-text-main text-base group-hover:text-primary transition-colors">SLP Core</span>
                  <code class="text-[10px] text-text-secondary bg-background px-1.5 py-0.5 rounded border border-border w-fit mt-1">SLP-MAIN</code>
                </div>
              </div>
            </td>
            <td class="px-6 py-5">
              <span class="inline-flex items-center px-3 py-1 rounded-lg bg-surface border border-border text-xs font-bold text-text-secondary shadow-sm group-hover:border-primary/30 transition-colors">
                UAT
              </span>
            </td>
            <td class="px-6 py-5 text-right">
               <div class="flex flex-col items-end gap-1">
                  <span class="font-bold text-amber-500">82%</span>
                  <div class="w-20 h-1.5 bg-background rounded-full overflow-hidden">
                      <div class="h-full bg-amber-500 w-[82%]"></div>
                  </div>
               </div>
            </td>
            <td class="px-6 py-5 text-right">
              <span class="inline-block px-3 py-1 rounded-full bg-red-500/10 text-red-600 dark:text-red-400 border border-red-500/20 font-bold text-xs group-hover:bg-red-500/20 transition-colors">
                18 Open
              </span>
            </td>
            <td class="px-6 py-5 text-xs text-text-secondary">
              <div class="flex flex-col">
                <span class="font-bold text-text-main">Yesterday</span>
                <span>04:45 PM</span>
              </div>
            </td>
            <td class="px-6 py-5">
              <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-red-500/10 text-red-600 dark:text-red-400 border border-red-500/20 text-xs font-bold">
                <span class="h-2 w-2 rounded-full bg-red-500"></span>
                Attention
              </span>
            </td>
            <td class="px-6 py-5 text-right pr-8">
               <button class="opacity-0 group-hover:opacity-100 translate-x-4 group-hover:translate-x-0 transition-all duration-300 rounded-xl p-2.5 hover:bg-background hover:shadow-lg text-primary border border-transparent hover:border-primary/10">
                 <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
               </button>
            </td>
          </tr>

        </tbody>
      </table>
    </div>
  </div>
</section>
