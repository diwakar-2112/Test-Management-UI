      <!-- Filter Bar -->
      <section class="bg-white border border-slate-100 rounded-2xl p-5 shadow-sm space-y-5 project-card ">
        <div class="flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
          <!-- Search -->
          <div class="flex-1 w-full max-w-lg">
            <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wide">Find Project</label>
            <div class="relative group">
              <span class="absolute inset-y-0 left-3 flex items-center text-slate-400 group-focus-within:text-indigo-500 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m21 21-4.35-4.35M10.5 18a7.5 7.5 0 1 0 0-15 7.5 7.5 0 0 0 0 15Z"/></svg>
              </span>
              <input type="text" placeholder="Search by name, key, or owner..." 
                class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all placeholder:text-slate-400 shadow-sm"
              />
            </div>
          </div>

          <!-- Dropdowns -->
          <div class="flex flex-wrap gap-4">
            <div class="w-32">
              <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wide">Sort by</label>
              <div class="relative">
                <select class="w-full appearance-none rounded-xl border border-slate-200 bg-white text-xs font-medium text-slate-700 px-3 py-2.5 pr-8 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 cursor-pointer shadow-sm transition-all hover:border-slate-300">

                  <option>Last run</option>

                <span class="pointer-events-none absolute inset-y-0 right-2.5 flex items-center">

                </span>
              </div>
            </div>
            
            <div class="w-32">
              <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wide">Environment</label>

                </span>
              </div>
            </div>
