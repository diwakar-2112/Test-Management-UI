<!-- Layout -->
<div class="min-h-screen flex flex-col md:flex-row">

  <!-- Sidebar (Desktop) -->
  <aside
    class="hidden md:flex w-64 flex-col bg-white border-r border-slate-100 shadow-[4px_0_24px_rgba(0,0,0,0.02)] z-20">
    <!-- Logo Area -->
    <div class="h-16 flex items-center gap-3 px-6 border-b border-slate-50">
      <div
        class="h-9 w-9 rounded-xl bg-gradient-to-br from-indigo-600 to-indigo-700 shadow-indigo-200 shadow-lg flex items-center justify-center text-xs font-bold text-white tracking-wide">
        QA
      </div>
      <div>
        <p class="text-sm font-bold text-slate-800 leading-tight">QA Console</p>
        <p class="text-[10px] uppercase font-semibold text-slate-400 tracking-wider mt-0.5">Administration</p>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 py-6 px-3 space-y-1">
      <p class="px-3 mb-3 text-[10px] font-bold tracking-widest uppercase text-slate-400">
        Main Menu
      </p>

      <!-- Active Item -->
      <button
        class="w-full flex items-center gap-3 px-3 py-2.5 text-sm font-medium text-indigo-700 bg-indigo-50 rounded-xl transition-all duration-200 shadow-sm border border-indigo-100">
        <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 7h7v10H3zM14 7h7v6h-7zM14 15h7v2a2 2 0 0 1-2 2h-5z" />
        </svg>
        Projects
      </button>

      <!-- Inactive Items with Hover effects -->
      <button
        class="group w-full flex items-center gap-3 px-3 py-2.5 text-sm font-medium text-slate-600 rounded-xl hover:bg-white hover:shadow-md hover:text-indigo-600 transition-all duration-200">
        <svg class="w-5 h-5 text-slate-400 group-hover:text-indigo-500 transition-colors" fill="none"
          stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h7" />
        </svg>
        Test runs
      </button>

      <button
        class="group w-full flex items-center gap-3 px-3 py-2.5 text-sm font-medium text-slate-600 rounded-xl hover:bg-white hover:shadow-md hover:text-indigo-600 transition-all duration-200">
        <svg class="w-5 h-5 text-slate-400 group-hover:text-indigo-500 transition-colors" fill="none"
          stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
        </svg>
        Defects
      </button>

      <button
        class="group w-full flex items-center gap-3 px-3 py-2.5 text-sm font-medium text-slate-600 rounded-xl hover:bg-white hover:shadow-md hover:text-indigo-600 transition-all duration-200">
        <svg class="w-5 h-5 text-slate-400 group-hover:text-indigo-500 transition-colors" fill="none"
          stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm7 8a7 7 0 0 0-14 0" />
        </svg>
        Users & roles
      </button>
    </nav>

    <!-- Sidebar Footer -->
    <div class="mx-3 mb-4 rounded-xl bg-slate-50 border border-slate-100 p-4 shadow-sm">
      <div class="flex items-center gap-3">
        <div class="h-8 w-8 rounded-full bg-slate-200 flex items-center justify-center">
          <span class="font-bold text-xs text-slate-500">QA</span>
        </div>
        <div class="flex flex-col">
          <p class="text-[11px] text-slate-500">Logged in as</p>
          <p class="text-xs font-bold text-slate-700">admin.qa</p>
        </div>
      </div>
      <div class="mt-3 pt-3 border-t border-slate-100 flex items-center justify-between text-[11px]">
        <span class="text-slate-500">Environment</span>
        <span
          class="inline-flex items-center rounded-md bg-emerald-100 px-2 py-0.5 font-bold text-emerald-700">QA</span>
      </div>
    </div>
  </aside>

  <!-- Main Area -->
  <div class="flex-1 flex flex-col bg-slate-50/50 relative overflow-hidden">
    <!-- Background Decor (Gradient Blur) -->
    <div
      class="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-indigo-50/50 to-transparent -z-10 pointer-events-none">
    </div>

    <!-- Top Header -->
    <header class="sticky top-0 z-30 border-b border-white/40 bg-white/70 backdrop-blur-xl transition-all">
      <div class="h-16 flex items-center justify-between px-4 lg:px-8">

        <!-- Left: Breadcrumb/Title -->
        <div class="flex items-center gap-3">
          <!-- Mobile Toggle (Only small screens) -->
          <div
            class="md:hidden h-8 w-8 rounded-lg bg-indigo-600 flex items-center justify-center text-xs font-semibold text-white shadow-lg shadow-indigo-200">
            QA
          </div>
          <div class="flex flex-col justify-center">
            <h1 class="text-lg font-bold text-slate-800 tracking-tight">Projects</h1>
            <span
              class="hidden sm:block text-[11px] font-medium text-indigo-500 bg-indigo-50 px-2 rounded-full w-fit">{{projectCount()}}
              Active Projects</span>
          </div>
        </div>

        <!-- Right: Actions -->
        <div class="flex items-center gap-2 sm:gap-4">
          <!-- Status Indicator -->
          <div
            class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-50/50 border border-emerald-100 text-xs font-medium text-emerald-700">
            <!-- <span class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span> -->
            <button mat-icon-button (click)="toggleTheme()">
  <!-- Change icon based on active theme -->
   @if (themeService.themeSignal() === 'dark') {
      <mat-icon>light_mode</mat-icon>
   } @else {
      <mat-icon>dark_mode</mat-icon>
   }
</button>
          </div>

          <!-- Notification Bell -->
          <button
            class="relative group rounded-full p-2.5 bg-white text-slate-500 hover:text-indigo-600 shadow-sm border border-slate-100 transition-all hover:shadow-md active:scale-95">
            <svg class="w-5 h-5 transition-transform group-hover:rotate-12" fill="none" stroke="currentColor"
              stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M14.857 17.657A2 2 0 0 1 13 19H11a2 2 0 0 1-1.857-1.343M15 8a3 3 0 1 0-6 0c0 3-1 4-2 5h10c-1-1-2-2-2-5Z" />
            </svg>
            <span class="absolute top-1 right-1.5 h-2 w-2 rounded-full bg-red-500 border-2 border-white"></span>
          </button>

          <!-- User Profile -->
          <button
            class="flex items-center gap-3 pl-1 pr-3 py-1 rounded-full bg-white border border-slate-100 shadow-sm hover:shadow-md transition-all active:scale-95">
            <div
              class="h-8 w-8 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 text-white text-xs font-bold flex items-center justify-center shadow-md ring-2 ring-white">
              {{ initials() }}

            </div>
            <span class="hidden sm:inline text-xs font-semibold text-slate-700">{{userName()||''}}</span>
          </button>
        </div>
      </div>

      <!-- Mobile Tabs -->
      <div class="md:hidden border-t border-slate-100 bg-white/50 backdrop-blur-sm">
        <div class="px-4 py-3 flex gap-2 overflow-x-auto text-xs no-scrollbar">
          <button
            class="flex items-center gap-1.5 rounded-full bg-indigo-600 shadow-lg shadow-indigo-200 text-white px-4 py-2 whitespace-nowrap font-medium">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M3 7h7v10H3zM14 7h7v6h-7z" />
            </svg>
            Projects
          </button>
          <button
            class="flex items-center gap-1.5 rounded-full bg-white border border-slate-200 text-slate-600 px-4 py-2 whitespace-nowrap font-medium shadow-sm">Test
            runs</button>
          <button
            class="flex items-center gap-1.5 rounded-full bg-white border border-slate-200 text-slate-600 px-4 py-2 whitespace-nowrap font-medium shadow-sm">Defects</button>
        </div>
      </div>
    </header>

    <!-- Scrollable Content -->
    <main class="flex-1 overflow-y-auto px-4 lg:px-8 py-8 space-y-8 pb-20">


      <app-project-list></app-project-list>
    </main>
  </div>
</div>
