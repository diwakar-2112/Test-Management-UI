<div class="page-background">
  <div class="login-card">
    <div class="header-section">
      <div class="icon-container">
        <i class="pi pi-lock" style="font-size: 1.5rem; color: white"></i>
      </div>
      <h1>Welcome Back</h1>
      <p>Enter your credentials to access your account</p>
    </div>

    <form [formGroup]="loginForm" class="form-section">
      <label for="username">EMAIL ADDRESS</label>
      <div class="p-input-icon-left full-width">
        <i class="pi pi-at"></i>
        <input
          pInputText
          formControlName="username"
          id="email"
          placeholder="name@company.com"
          class="custom-input"
        />
        <small *ngIf="isFieldInvalid('username')" class="error-text"> Username is required </small>
      </div>

      <div class="label-row">
        <label for="password">PASSWORD</label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>
      <div class="p-input-icon-left full-width">
        <i class="pi pi-lock"></i>
        <input
          formControlName="password"
          placeholder="Enter your password"
          styleClass="w-full"
          class="custom-input"
          [style]="{ width: '100%' }"
        />
      </div>

      <p-button
        [label]="isSignupMode() ? 'Sign up' : 'Sign in'"
        (click)="onSubmit()"
         [loading]="isLoading()"
        [style]="{ width: '100%' }"
        styleClass="gradient-button full-width-btn"
      ></p-button>
    </form>

    <div class="footer">
      <span>Don't have an account? </span>
      <a href="javascript:void(0)" (click)="toggleSign()">Sign up now</a>
    </div>
  </div>
</div>

<div class="card flex justify-center gap-2">
  <p-toast styleClass="center-toast" />
</div>
